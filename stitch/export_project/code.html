<div class="space-y-2">
<h2 class="font-headline font-extrabold text-4xl lg:text-5xl text-on-surface tracking-tighter">Finalizing your vision</h2>
<p class="text-on-surface-variant font-body text-lg max-w-md">Encoding your spiritual journey with cinematic precision.</p>

</div>
<div class="h-24 w-full bg-surface-container-lowest rounded-lg relative overflow-hidden flex items-end px-1">

<div class="absolute inset-0 opacity-10 waveform-bar bg-on-surface"></div>
<!-- Active Progress Gold Waveform -->
<div class="h-full bg-secondary waveform-bar transition-all duration-1000 ease-out" style="width: 84%"></div>

<div class="absolute top-0 bottom-0 w-1 bg-secondary shadow-[0_0_20px_#e9c349] blur-[2px]" style="left: 84%"></div>
</div>

<span class="material-symbols-outlined">hd</span>
<span class="font-medium">1080p Full HD</span>
</div>
<span class="material-symbols-outlined">check_circle</span>
<input checked="" class="hidden" name="resolution" type="radio" value="1080"/>
</label>
<label class="flex items-center justify-between p-4 rounded-lg bg-surface-container-highest text-on-surface-variant cursor-pointer hover:bg-surface-bright transition-all">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined">hd</span>
<span class="font-medium">720p Standard</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant"></div>
<input class="hidden" name="resolution" type="radio" value="720"/>
</label>
</div>
</div>

</button>
<button class="flex flex-col items-center gap-3 p-4 rounded-lg bg-surface-container-high hover:bg-surface-bright transition-all group">
<div class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-highest text-on-surface group-hover:text-secondary">
<span class="material-symbols-outlined text-2xl">rebase_edit</span>
</div>
<span class="text-[10px] uppercase tracking-widest font-bold">Reels</span>
</button>
<button class="flex flex-col items-center gap-3 p-4 rounded-lg bg-surface-container-high hover:bg-surface-bright transition-all group">
<div class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-highest text-on-surface group-hover:text-secondary">
<span class="material-symbols-outlined text-2xl">video_library</span>
</div>
<span class="text-[10px] uppercase tracking-widest font-bold">Shorts</span>

</div>
</div>

</button>
<button class="text-on-tertiary-container font-label text-xs uppercase tracking-widest hover:text-primary transition-colors">
