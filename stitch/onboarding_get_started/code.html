      }

        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l2.5 7.5L40 10l-7.5 2.5L30 20l-2.5-7.5L20 10l7.5-2.5L30 0zm0 40l2.5 7.5L40 50l-7.5 2.5L30 60l-2.5-7.5L20 50l7.5-2.5L30 40zM0 30l2.5-7.5L10 20l-2.5-7.5L0 10l7.5 2.5L10 20l-2.5 7.5L0 30zm40 0l2.5-7.5L50 20l-2.5-7.5L40 10l7.5 2.5L50 20l-2.5 7.5L40 30z' fill='%23e2e2e2' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");

<body class="bg-background text-on-background font-body min-h-screen flex flex-col overflow-hidden">
<!-- Main Content Canvas -->
<main class="flex-grow relative flex flex-col items-center justify-center px-6 pt-12 pb-24 overflow-y-auto overflow-x-hidden islamic-pattern">
<!-- Background Glow -->
<div class="absolute top-[-10%] right-[-10%] w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-secondary/5 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Success Header Section -->
<div class="w-full max-w-lg text-center mb-12 space-y-6">
<div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-primary-container text-primary mb-2 shadow-lg shadow-primary/10">
<span class="material-symbols-outlined !text-5xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h1 class="font-headline font-extrabold text-4xl md:text-5xl tracking-tight leading-tight text-on-surface">
                Ready to <span class="text-primary">Share</span>
</h1>
<p class="text-on-surface-variant text-lg leading-relaxed max-w-md mx-auto">
                Your cinematic Quranic creation is ready. Export for TikTok / Reels in stunning high definition.
            </p>
</div>
<!-- Platform Bento Grid -->
<div class="w-full max-w-2xl grid grid-cols-2 md:grid-cols-4 gap-4 mb-16">
<!-- TikTok -->
<div class="aspect-square glass-panel rounded-lg flex flex-col items-center justify-center p-6 border border-outline-variant/10 group hover:bg-primary-container/20 transition-all duration-300">
<div class="w-12 h-12 bg-surface-container-highest rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-on-surface text-2xl">music_note</span>
</div>
<span class="text-sm font-medium tracking-wide">TikTok</span>
</div>
<!-- Instagram -->
<div class="aspect-square glass-panel rounded-lg flex flex-col items-center justify-center p-6 border border-outline-variant/10 group hover:bg-primary-container/20 transition-all duration-300">
<div class="w-12 h-12 bg-surface-container-highest rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-on-surface text-2xl">camera</span>
</div>
<span class="text-sm font-medium tracking-wide">Reels</span>
</div>
<!-- YouTube -->
<div class="aspect-square glass-panel rounded-lg flex flex-col items-center justify-center p-6 border border-outline-variant/10 group hover:bg-primary-container/20 transition-all duration-300">
<div class="w-12 h-12 bg-surface-container-highest rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-on-surface text-2xl">smart_display</span>
</div>
<span class="text-sm font-medium tracking-wide">Shorts</span>
</div>
<!-- Generic/Other -->
<div class="aspect-square glass-panel rounded-lg flex flex-col items-center justify-center p-6 border border-outline-variant/10 group hover:bg-primary-container/20 transition-all duration-300">
<div class="w-12 h-12 bg-surface-container-highest rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-on-surface text-2xl">download</span>
</div>
<span class="text-sm font-medium tracking-wide">Download</span>
</div>
</div>
<!-- Preview Card -->
<div class="w-full max-w-md relative mb-16 group">
<div class="absolute -inset-1 bg-gradient-to-r from-primary/20 to-secondary/20 rounded-lg blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
<div class="relative surface-container-low rounded-lg p-3 overflow-hidden aspect-[9/16] max-h-[300px] flex items-center justify-center">
<img class="absolute inset-0 w-full h-full object-cover opacity-60 rounded-lg" data-alt="atmospheric vertical cinematic shot of ancient calligraphy on textured paper with dramatic sunlight rays and floating dust particles" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC8oY7LiEP3SncwphhgMhLImx83nbsm1jqEsoLab-7eH1T39uMKNu3Yf_yPrDZTDv_dBD--NgLy6VARvyLDPgL38IK-muWBgzMYBOX7qis-sJp6ZwWr8yeNSi_EPOz5ycJ6QROVmH732ErYOyPexxCDBCl_gQPdnmjz3FgYduguJjJihKXLu-zbynlk7bEDRZe1NEB97fxwic_1kBO5kWCVvQYSljlkDXJDvK4-Tn04X7vEpUS4cADxJQPRB7hRLyB-GG20xSao049n"/>
<div class="relative z-10 flex flex-col items-center text-center px-8">
<div class="bg-primary/20 backdrop-blur-md px-4 py-2 rounded-full border border-primary/30 mb-4">
<p class="text-[10px] uppercase tracking-widest font-bold text-primary">Preview Rendered</p>
</div>
</div>
</div>
</div>
<!-- Call to Action Container -->
<div class="w-full max-w-sm px-6">
<button class="w-full py-5 rounded-lg bg-gradient-to-r from-secondary to-secondary-container text-on-secondary font-headline font-extrabold text-xl shadow-2xl shadow-secondary/20 hover:scale-[1.02] active:scale-95 transition-all duration-300 flex items-center justify-center gap-3">
                Start Creating
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="mt-6 text-center text-on-surface-variant/60 text-xs tracking-widest uppercase">
                Join 10,000+ Digital Creators
            </p>
</div>
</main>
<!-- Bottom Navigation Mock (Suppressed for focused CTA as per hierarchy rule, but shell is defined in JSON) -->
<!-- Navigation is hidden here because the intent is "Onboarding Final CTA" which is transactional/focused -->
