<body class="bg-background text-on-background font-body min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Background Spiritual Glow -->
<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary-container/20 rounded-full blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-secondary/5 rounded-full blur-[100px] pointer-events-none"></div>
<main class="w-full max-w-md px-6 z-10">
<!-- Brand / Header Section -->
<div class="mb-12 text-center">
<div class="flex justify-center mb-8">
<div class="w-16 h-16 bg-primary-container rounded-lg flex items-center justify-center shadow-2xl">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="auto_awesome">auto_awesome</span>
</div>
</div>
<h2 class="text-4xl font-headline font-extrabold uthmani text-primary mb-2">السَّلَامُ عَلَيْكُمْ</h2>
<h1 class="text-2xl font-headline font-bold tracking-tight text-on-surface">As-salamu alaykum</h1>
<p class="mt-4 text-on-surface-variant font-medium opacity-80">Welcome back to Deen Studio</p>
</div>
<!-- Authentication Form -->
<div class="bg-surface-container-low p-8 rounded-lg shadow-[0_24px_48px_rgba(0,0,0,0.2)]">
<form action="#" class="space-y-5" method="POST">
<!-- Email Input -->
<div class="space-y-2">
<label class="text-xs font-label uppercase tracking-widest text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-container-high border-none focus:ring-1 focus:ring-secondary/40 text-on-surface rounded-md px-4 py-4 text-sm transition-all placeholder:text-outline/40" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="text-xs font-label uppercase tracking-widest text-on-surface-variant" for="password">Password</label>
<a class="text-[10px] uppercase tracking-tighter text-secondary font-bold hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-high border-none focus:ring-1 focus:ring-secondary/40 text-on-surface rounded-md px-4 py-4 text-sm transition-all placeholder:text-outline/40" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline font-bold py-4 rounded-md shadow-lg shadow-primary-container/20 active:scale-95 transition-all mt-4" type="submit">
                    Sign In to Sanctuary
                </button>
</form>
<!-- Divider -->
<div class="relative my-10">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-outline-variant/15"></div></div>
<div class="relative flex justify-center text-[10px] uppercase tracking-[0.2em] font-medium text-outline">
<span class="bg-surface-container-low px-4">Or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 bg-surface-container-highest/40 hover:bg-surface-container-highest transition-colors py-3 rounded-md group">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M12.48 10.92v3.28h7.84c-.24 1.84-.9 3.22-1.84 4.16-1.12 1.12-2.8 2.26-6 2.26-5.06 0-9.14-4.08-9.14-9.14s4.08-9.14 9.14-9.14c2.74 0 4.8 1.08 6.32 2.52l2.32-2.32C18.96 1.3 16.04 0 12.48 0 5.86 0 .5 5.36.5 12s5.36 12 11.98 12c3.6 0 6.32-1.18 8.44-3.4 2.18-2.18 2.88-5.3 2.88-7.92 0-.52-.04-1.04-.12-1.76H12.48z" fill="#EA4335"></path>
</svg>
<span class="text-xs font-bold text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-3 bg-surface-container-highest/40 hover:bg-surface-container-highest transition-colors py-3 rounded-md group">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.96.95-2.04 1.72-3.23 1.72-1.14 0-1.52-.71-2.91-.71-1.39 0-1.83.7-2.92.7-1.14 0-2.32-.82-3.32-1.83C2.6 18.1 1.05 14.57 1.05 11.39c0-3.18 2.06-4.88 4.07-4.88 1.06 0 1.88.66 2.62.66.72 0 1.48-.68 2.76-.68 1.14 0 2.18.57 2.87 1.43-2.8 1.63-2.34 5.39.46 6.55-.73 1.81-1.68 3.63-2.88 4.81zM11.96 5.8c-.03-2.45 2.02-4.52 4.43-4.63.19 2.56-2.08 4.76-4.43 4.63z"></path>
</svg>
<span class="text-xs font-bold text-on-surface">Apple</span>
</button>
</div>
</div>
<!-- Footer Message -->
<p class="mt-10 text-center text-sm text-on-surface-variant">
            Don't have an account? 
            <a class="text-secondary font-bold hover:underline ml-1" href="#">Create journey</a>
</p>
<!-- Decorative Pattern (Faint) -->
<div class="fixed inset-0 pointer-events-none opacity-[0.02]" style="background-image: radial-gradient(#a2d1bb 1px, transparent 0); background-size: 40px 40px;">
</div>

<!-- Side Content / Asymmetry Element -->
